<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>התראות בזמן אמת</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: Arial, sans-serif; display: flex; flex-direction: row; height: 100vh; background: #111; color: #eee; direction: rtl; }

    #sidebar {
      width: 300px; min-width: 300px;
      background: #1a1a1a;
      display: flex; flex-direction: column;
      border-left: 1px solid #333;
      overflow: hidden;
    }
    #sidebar h1 { padding: 12px 14px; font-size: 14px; border-bottom: 1px solid #333; background: #222; }

    #status {
      padding: 8px 14px; font-size: 12px; color: #888;
      border-bottom: 1px solid #2a2a2a;
      display: flex; align-items: center; gap: 8px;
    }
    #dot { width: 8px; height: 8px; border-radius: 50%; background: #555; flex-shrink: 0; }
    #dot.active { background: #e74c3c; box-shadow: 0 0 8px #e74c3c; animation: blink 1s infinite; }
    #dot.ok { background: #2ecc71; }
    #dot.connecting { background: #f39c12; }
    @keyframes blink { 0%,100%{opacity:1}50%{opacity:0.3} }

    #tabs { display: flex; border-bottom: 1px solid #333; background: #1e1e1e; }
    .tab {
      flex: 1; padding: 8px 4px; font-size: 12px; text-align: center;
      cursor: pointer; color: #666; border-bottom: 2px solid transparent;
    }
    .tab.active { color: #eee; border-bottom-color: #e74c3c; }

    #search-wrap { padding: 10px 12px; border-bottom: 1px solid #2a2a2a; position: relative; }
    #search {
      width: 100%; padding: 7px 10px; background: #252525;
      border: 1px solid #3a3a3a; border-radius: 4px;
      color: #eee; font-size: 13px; outline: none;
    }
    #search:focus { border-color: #555; }
    #suggestions {
      position: absolute; left: 12px; right: 12px; top: 100%;
      background: #252525; border: 1px solid #3a3a3a; border-top: none;
      border-radius: 0 0 4px 4px; max-height: 160px; overflow-y: auto;
      display: none; z-index: 999;
    }
    .suggestion { padding: 7px 10px; font-size: 12px; cursor: pointer; }
    .suggestion:hover { background: #333; }
    .sug-zone { font-size: 11px; color: #888; }

    #panel { flex: 1; overflow-y: auto; }

    /* Live */
    .alert-item { padding: 10px 14px; border-bottom: 1px solid #2a2a2a; font-size: 13px; }
    .alert-item .city { font-weight: bold; color: #e74c3c; }
    .alert-item .zone { font-size: 11px; color: #888; margin-top: 2px; }
    .alert-item .countdown { font-size: 11px; color: #f39c12; margin-top: 2px; }


    #map { flex: 1; }
    #error-bar {
      display: none; position: fixed; bottom: 0; left: 0; right: 0;
      background: #c0392b; color: white;
      padding: 8px 16px; font-size: 12px; text-align: center; z-index: 9999;
    }
  </style>
</head>
<body>

<div id="sidebar">
  <h1>🚨 התראות פיקוד העורף</h1>
  <div id="status"><div id="dot" class="connecting"></div><span id="status-text">מתחבר...</span></div>

  <div id="search-wrap">
    <input id="search" type="text" placeholder="חפש עיר או אזור...">
    <div id="suggestions"></div>
  </div>

  <div id="tabs">
    <div class="tab active" onclick="switchTab('live')">שידור חי</div>
    <div class="tab" onclick="switchTab('history')">התראות</div>
  </div>

  <div id="panel">
    <div id="tab-live">
      <div id="alert-list">
        <div style="padding:20px;font-size:13px;color:#555;text-align:center">אין התראות פעילות</div>
      </div>
    </div>
    <div id="tab-history" style="display:none">
      <!-- Paste section -->
      <div style="padding:8px 12px;border-bottom:1px solid #2a2a2a">
        <div style="display:flex;gap:8px;align-items:center">
          <button onclick="document.getElementById('paste-box').style.display=document.getElementById('paste-box').style.display==='none'?'':'none'" style="padding:4px 8px;background:#333;color:#eee;border:1px solid #555;border-radius:4px;font-size:11px;cursor:pointer">הדבק נתונים</button>
          <a href="https://www.oref.org.il/heb/alerts-history" target="_blank" style="font-size:11px;color:#666;text-decoration:underline">אתר פיקוד העורף</a>
        </div>
        <div id="paste-box" style="display:none;margin-top:8px">
          <textarea id="paste-input" placeholder="Ctrl+A, Ctrl+C מעמוד פיקוד העורף, הדבק כאן..." style="width:100%;height:70px;background:#252525;border:1px solid #3a3a3a;border-radius:4px;color:#eee;font-size:11px;padding:6px;resize:vertical"></textarea>
          <button onclick="parsePastedAlerts()" style="margin-top:4px;padding:4px 12px;background:#e74c3c;color:#fff;border:none;border-radius:4px;font-size:11px;cursor:pointer">טען</button>
        </div>
      </div>
      <!-- Filters -->
      <div id="filter-bar" style="padding:8px 12px;border-bottom:1px solid #2a2a2a"></div>
      <!-- City/region filter -->
      <div style="padding:6px 12px;border-bottom:1px solid #2a2a2a">
        <input id="hist-search" type="text" placeholder="סנן לפי עיר או אזור..." oninput="applyFilters()" style="width:100%;padding:5px 8px;background:#252525;border:1px solid #3a3a3a;border-radius:4px;color:#eee;font-size:12px;outline:none">
      </div>
      <!-- Results -->
      <div id="today-list">
        <div style="padding:20px;font-size:13px;color:#555;text-align:center">טוען...</div>
      </div>
    </div>
  </div>
</div>

<div id="map"></div>
<div id="error-bar"></div>

<script>
const WORKER = 'https://tight-star-aab7.mataroll123.workers.dev';

// ── Map ────────────────────────────────────────────────────────────────────
const map = L.map('map').setView([31.5, 34.9], 8);
L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
  attribution: '© OpenStreetMap contributors', maxZoom: 18
}).addTo(map);

// ── State ──────────────────────────────────────────────────────────────────
let citiesMap  = {};
let citiesList = [];
let activeMarkers = {};
let searchMarkers = [];
let lastRecordedKey = null;

// ── Cities DB ──────────────────────────────────────────────────────────────
async function loadCities() {
  const res  = await fetch('https://raw.githubusercontent.com/eladnava/pikud-haoref-api/master/cities.json');
  const data = await res.json();
  citiesList = data.filter(c => c.lat && c.lng && c.lat !== 0);
  for (const c of citiesList) { citiesMap[c.value] = c; citiesMap[c.name] = c; }
}

// ── Icons ──────────────────────────────────────────────────────────────────
const redIcon = L.divIcon({
  className: '',
  html: '<div style="width:14px;height:14px;border-radius:50%;background:#e74c3c;border:2px solid #fff;box-shadow:0 0 10px #e74c3c;animation:blink 1s infinite"></div>',
  iconSize: [14,14], iconAnchor: [7,7]
});
const blueIcon = L.divIcon({
  className: '',
  html: '<div style="width:10px;height:10px;border-radius:50%;background:#3498db;border:2px solid #fff"></div>',
  iconSize: [10,10], iconAnchor: [5,5]
});

// ── Status ─────────────────────────────────────────────────────────────────
function setStatus(state, text) {
  // state: 'active' | 'ok' | 'connecting'
  document.getElementById('dot').className = state;
  document.getElementById('status-text').textContent = text;
}
function showError(msg) {
  const b = document.getElementById('error-bar');
  b.textContent = msg; b.style.display = 'block';
  setTimeout(() => b.style.display = 'none', 6000);
}

// ── Tabs ───────────────────────────────────────────────────────────────────
function switchTab(tab) {
  document.querySelectorAll('.tab').forEach((t,i) =>
    t.classList.toggle('active', (i===0&&tab==='live')||(i===1&&tab==='history')));
  document.getElementById('tab-live').style.display    = tab==='live'    ? '' : 'none';
  document.getElementById('tab-history').style.display = tab==='history' ? '' : 'none';
  if (tab === 'history') fetchOrefHistory();
}

// ── Render live alerts ─────────────────────────────────────────────────────
let clearTimer = null;
let accumulatedCities = {};

function renderAlerts(cities, title) {
  const list = document.getElementById('alert-list');

  if (!cities || !cities.length) {
    // don't clear immediately — wait 60s
    if (!clearTimer && Object.keys(accumulatedCities).length) {
      clearTimer = setTimeout(() => {
        accumulatedCities = {};
        clearTimer = null;
        for (const m of Object.values(activeMarkers)) m.remove();
        activeMarkers = {};
        list.innerHTML = '<div style="padding:20px;font-size:13px;color:#555;text-align:center">אין התראות פעילות</div>';
        setStatus('ok', 'אין התראות פעילות');
      }, 60000);
    } else if (!Object.keys(accumulatedCities).length) {
      list.innerHTML = '<div style="padding:20px;font-size:13px;color:#555;text-align:center">אין התראות פעילות</div>';
      setStatus('ok', 'אין התראות פעילות');
    }
    return;
  }

  // new alert — cancel any pending clear, accumulate cities
  if (clearTimer) { clearTimeout(clearTimer); clearTimer = null; }
  for (const name of cities) accumulatedCities[name] = title || 'Alert';
  cities = Object.keys(accumulatedCities);

  for (const m of Object.values(activeMarkers)) m.remove();
  activeMarkers = {};


  list.innerHTML = '';
  setStatus('active', `התראה פעילה ב־${cities.length} אזורים`);
  const bounds = [];
  for (const name of cities) {
    const c = citiesMap[name];
    const div = document.createElement('div');
    div.className = 'alert-item';
    div.innerHTML = `
      <div class="city">${c ? c.name_en||name : name}</div>
      <div class="zone">${c ? c.zone_en||'' : ''}</div>
      ${c&&c.countdown ? `<div class="countdown">⏱ ${c.countdown}s to shelter</div>` : ''}
    `;
    list.appendChild(div);
    if (c) {
      const m = L.marker([c.lat,c.lng],{icon:redIcon}).addTo(map)
        .bindPopup(`<b>${c.name_en||name}</b><br>${c.zone_en||''}`);
      activeMarkers[name] = m;
      bounds.push([c.lat,c.lng]);
    }
  }
  if (bounds.length) map.fitBounds(bounds, {padding:[60,60], maxZoom:10});
  recordAlert(cities, title || '');
}

// ── Record alert to Worker KV ──────────────────────────────────────────────
async function recordAlert(cities, title) {
  const key = [...cities].sort().join(',');
  if (key === lastRecordedKey) return;
  lastRecordedKey = key;
  setTimeout(() => { if (lastRecordedKey === key) lastRecordedKey = null; }, 60000);
  try {
    fetch(`${WORKER}/record`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ cities, title: title || 'Alert' })
    });
  } catch {}
}

// ── WebSocket (tzevadom real-time) ─────────────────────────────────────────
let ws;

function connectWS() {
  setStatus('connecting', 'מתחבר...');
  ws = new WebSocket('wss://tzevadom.com/api/ws');

  ws.onopen = () => {
    setStatus('ok', 'אין התראות פעילות');
  };

  ws.onmessage = (e) => {
    try {
      const msg = JSON.parse(e.data);
      // tzevadom sends various message types — find cities array
      const cities = msg.cities || msg.data || msg.alerts || (Array.isArray(msg) ? msg : null);
      if (Array.isArray(cities) && cities.length > 0) {
        // cities may be objects or strings
        const names = cities.map(c => typeof c === 'string' ? c : c.name || c.city || c.value || '');
        renderAlerts(names);
      } else if (msg.type === 'clear' || (Array.isArray(cities) && cities.length === 0)) {
        renderAlerts([]);
      }
    } catch {}
  };

  ws.onclose = () => {
    setStatus('connecting', 'מתחבר מחדש...');
    setTimeout(connectWS, 3000);
  };

  ws.onerror = () => {
    ws.close();
    // fallback to polling if WS fails
  };
}


// ── Search ─────────────────────────────────────────────────────────────────
const searchEl = document.getElementById('search');
const sugEl    = document.getElementById('suggestions');

searchEl.addEventListener('input', () => {
  const q = searchEl.value.trim().toLowerCase();
  sugEl.innerHTML = '';
  if (q.length < 2) { sugEl.style.display = 'none'; return; }

  const isHebrew = /[\u0590-\u05FF]/.test(q);
  const zones  = new Map();
  const cities = [];
  for (const c of citiesList) {
    const zoneMatch = isHebrew
      ? (c.zone||'').includes(q)
      : (c.zone_en||'').toLowerCase().includes(q);
    const cityMatch = isHebrew
      ? (c.name||'').includes(q)
      : (c.name_en||'').toLowerCase().includes(q);
    const zoneKey = isHebrew ? (c.zone||c.zone_en) : c.zone_en;
    if (zoneMatch && !zones.has(zoneKey)) zones.set(zoneKey, c);
    if (cityMatch) cities.push(c);
  }

  const results = [];
  for (const [zone, c] of zones) {
    const label = isHebrew ? (c.zone||zone) : zone;
    const sub   = isHebrew ? (c.zone_en||'') : 'Region';
    results.push({label, sub, isZone: true, zone: c.zone_en});
    if (results.length >= 4) break;
  }
  for (const c of cities) {
    const label = isHebrew ? (c.name||c.name_en) : (c.name_en||c.name);
    const sub   = isHebrew ? (c.zone||c.zone_en||'') : (c.zone_en||'');
    results.push({label, sub, isZone: false, city: c});
    if (results.length >= 10) break;
  }

  if (!results.length) { sugEl.style.display='none'; return; }
  for (const r of results) {
    const d = document.createElement('div');
    d.className = 'suggestion';
    d.innerHTML = `<div>${r.label}</div><div class="sug-zone">${r.sub}</div>`;
    d.onclick = () => selectResult(r);
    sugEl.appendChild(d);
  }
  sugEl.style.display = 'block';
});

document.addEventListener('click', e => { if (!e.target.closest('#search-wrap')) sugEl.style.display='none'; });

function selectResult(r) {
  searchEl.value = r.label;
  sugEl.style.display = 'none';
  for (const m of searchMarkers) m.remove();
  searchMarkers = [];

  const match = r.isZone ? citiesList.filter(c => c.zone_en === r.zone) : [r.city];
  const bounds = [];
  for (const c of match) {
    const m = L.marker([c.lat,c.lng],{icon:blueIcon}).addTo(map)
      .bindPopup(`<b>${c.name_en||c.name}</b><br>${c.zone_en||''}`);
    searchMarkers.push(m);
    bounds.push([c.lat,c.lng]);
  }
  if (bounds.length) map.fitBounds(bounds, {padding:[60,60], maxZoom:11});
  // Switch to history tab and filter by the selected city/zone
  document.getElementById('hist-search').value = r.label;
  switchTab('history');
  applyFilters();
}



// ── Alerts Archive (persistent localStorage + live sources) ─────────────
const ARCHIVE_KEY = 'oref_alerts_archive';
let orefHistoryData = [];
let lastOrefFetch = 0;

function getTodayStr() {
  const d = new Date();
  return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0');
}

// Load all archived alerts from localStorage
function loadArchive() {
  try { return JSON.parse(localStorage.getItem(ARCHIVE_KEY) || '[]'); }
  catch { return []; }
}

// Save alerts to localStorage archive (merge + deduplicate)
function saveToArchive(newAlerts) {
  const existing = loadArchive();
  const seen = new Set(existing.map(a => (a.alertDate||'').slice(0,16) + '|' + a.data));
  let added = 0;
  for (const a of newAlerts) {
    const key = (a.alertDate||'').slice(0,16) + '|' + a.data;
    if (!seen.has(key)) {
      existing.push(a);
      seen.add(key);
      added++;
    }
  }
  if (added > 0) {
    existing.sort((a, b) => (b.alertDate || '').localeCompare(a.alertDate || ''));
    localStorage.setItem(ARCHIVE_KEY, JSON.stringify(existing));
  }
  return existing;
}

async function fetchOrefHistory() {
  // don't re-fetch if less than 2 min since last fetch
  if (Date.now() - lastOrefFetch < 120000 && orefHistoryData.length) {
    renderOrefHistory(orefHistoryData);
    return;
  }
  const list = document.getElementById('today-list');
  list.innerHTML = '<div style="padding:20px;font-size:13px;color:#555;text-align:center">טוען היסטוריה...</div>';

  // Fetch both live sources in parallel
  const [orefData, workerData] = await Promise.all([
    fetch('https://www.oref.org.il/WarningMessages/alert/History/AlertsHistory.json', {
      headers: { 'Referer': 'https://www.oref.org.il/', 'X-Requested-With': 'XMLHttpRequest' }
    }).then(r => r.json()).catch(() => []),
    fetch(`${WORKER}/history`).then(r => r.json()).catch(() => [])
  ]);

  // Convert oref format
  const orefAlerts = (Array.isArray(orefData) ? orefData : []).map(a => ({
    alertDate: a.alertDate, data: a.data, title: a.title, category: a.category
  }));

  // Convert Worker KV format
  const workerAlerts = (Array.isArray(workerData) ? workerData : [])
    .filter(w => w.date)
    .map(w => ({
      alertDate: w.date, data: w.name, title: w.title || 'ירי רקטות וטילים', category: 1
    }));

  // Save new data to permanent archive & get full archive back
  orefHistoryData = saveToArchive([...orefAlerts, ...workerAlerts]);
  lastOrefFetch = Date.now();
  renderOrefHistory(orefHistoryData);
}

// Parse pasted text from oref alerts-history page
// Format is:
//   [alert type line]   ← e.g. "ירי רקטות וטילים" or "האירוע הסתיים"
//   HH:MM               ← time
//   city1, city2, ...   ← comma-separated cities
//   HH:MM               ← next time (same type continues)
//   city1, city2
//   [new type line]     ← type changes
//   ...
function parsePastedAlerts() {
  const text = document.getElementById('paste-input').value.trim();
  if (!text) return;

  const alerts = [];
  const lines = text.split('\n').map(l => l.trim()).filter(Boolean);
  const today = getTodayStr();

  // Extract date from "היום DD.MM.YYYY" line if present
  let dateStr = today;
  const dateLine = lines.find(l => /היום\s+(\d{2}\.\d{2}\.\d{4})/.test(l));
  if (dateLine) {
    const m = dateLine.match(/(\d{2})\.(\d{2})\.(\d{4})/);
    if (m) dateStr = m[3] + '-' + m[2] + '-' + m[1];
  }

  const alertTypes = ['ירי רקטות וטילים', 'חדירת כלי טיס עוין', 'רעידת אדמה', 'צונאמי', 'חומרים מסוכנים', 'האירוע הסתיים', 'התגוננו', 'בדקות הקרובות'];
  const skipLines = ['התרעות', 'בחרו יישוב', 'כל הארץ', 'לא יודעים', 'יממה אחרונה', 'הצג עוד', '3000+', '+'];

  let currentTitle = '';
  let currentTime = '';

  for (const line of lines) {
    // Skip header/UI lines
    if (skipLines.some(s => line.startsWith(s))) continue;
    if (/^\d+\+?\s*התרעות$/.test(line)) continue;
    if (/^היום/.test(line)) continue;

    // Check if line is an alert type
    const foundType = alertTypes.find(t => line === t || line.startsWith(t));
    if (foundType) {
      if (foundType === 'בדקות הקרובות') continue; // skip warning line
      currentTitle = foundType;
      continue;
    }

    // Check if line is a time (HH:MM)
    if (/^\d{1,2}:\d{2}$/.test(line)) {
      currentTime = line.length === 4 ? '0' + line : line;
      continue;
    }

    // Otherwise it's a cities line — needs both time and title context
    if (currentTime && currentTitle) {
      const cities = line.split(/,/).map(c => c.trim()).filter(c => c.length > 0);
      const cat = currentTitle === 'האירוע הסתיים' ? 13 : 1;
      for (const city of cities) {
        alerts.push({
          alertDate: dateStr + ' ' + currentTime + ':00',
          data: city,
          title: currentTitle,
          category: cat
        });
      }
    }
  }

  if (alerts.length) {
    // Save to permanent archive
    orefHistoryData = saveToArchive(alerts);
    renderOrefHistory(orefHistoryData);
    document.getElementById('paste-box').style.display = 'none';
    document.getElementById('paste-input').value = '';
  } else {
    alert('לא הצלחתי לזהות התראות בטקסט. נסה להעתיק שוב את כל העמוד.');
  }
}

let archiveFilter = 'today'; // 'today', 'all', or 'YYYY-MM-DD'

function applyFilters() {
  renderOrefHistory(orefHistoryData);
}

function renderOrefHistory(data) {
  const filterBar = document.getElementById('filter-bar');
  const list = document.getElementById('today-list');

  if (!data.length) {
    filterBar.innerHTML = '';
    list.innerHTML = '<div style="padding:20px;font-size:13px;color:#555;text-align:center">אין התראות. הדבק נתונים מפיקוד העורף.</div>';
    return;
  }

  const today = getTodayStr();
  const dates = [...new Set(data.map(a => (a.alertDate||'').slice(0,10)))].sort().reverse();
  const cityQuery = (document.getElementById('hist-search')?.value || '').trim().toLowerCase();

  // ── Date filter buttons ──
  const makeBtn = (label, value) => {
    const active = archiveFilter === value;
    return `<button onclick="archiveFilter='${value}';applyFilters()" style="padding:3px 8px;font-size:11px;border:1px solid ${active?'#e74c3c':'#444'};background:${active?'#e74c3c':'#2a2a2a'};color:${active?'#fff':'#aaa'};border-radius:3px;cursor:pointer">${label}</button>`;
  };
  let btns = makeBtn('היום', 'today') + makeBtn('הכל', 'all');
  for (const d of dates) {
    if (d === today) continue;
    btns += makeBtn(d.slice(8,10) + '/' + d.slice(5,7), d);
  }
  filterBar.innerHTML = `<div style="display:flex;gap:5px;flex-wrap:wrap">${btns}</div>`;

  // ── Apply date filter ──
  let filtered = data;
  if (archiveFilter === 'today') {
    filtered = data.filter(a => (a.alertDate||'').startsWith(today));
  } else if (archiveFilter !== 'all') {
    filtered = data.filter(a => (a.alertDate||'').startsWith(archiveFilter));
  }

  // ── Apply city/region text filter ──
  if (cityQuery) {
    const isHeb = /[\u0590-\u05FF]/.test(cityQuery);
    filtered = filtered.filter(a => {
      const city = a.data || '';
      const c = citiesMap[city];
      if (isHeb) {
        return city.includes(cityQuery) || (c && (c.zone||'').includes(cityQuery));
      } else {
        const en = (c ? c.name_en||'' : '').toLowerCase();
        const zone = (c ? c.zone_en||'' : '').toLowerCase();
        return en.includes(cityQuery) || zone.includes(cityQuery);
      }
    });
  }

  // ── Skip "event ended" unless specifically searched ──
  if (!cityQuery) {
    filtered = filtered.filter(a => a.category !== 13);
  }

  list.innerHTML = '';

  // Summary
  const header = document.createElement('div');
  header.style.cssText = 'padding:8px 14px;font-size:12px;color:#888;border-bottom:1px solid #2a2a2a';
  header.textContent = `${filtered.length} התראות${cityQuery ? ' (מסונן)' : ''} · ${data.length} סה"כ בארכיון`;
  list.appendChild(header);

  if (!filtered.length) {
    const empty = document.createElement('div');
    empty.style.cssText = 'padding:20px;font-size:13px;color:#555;text-align:center';
    empty.textContent = 'אין התראות';
    list.appendChild(empty);
    return;
  }

  // ── Group by date → time+type ──
  let lastDate = '';
  let currentGroup = null;
  const groups = [];
  for (const item of filtered) {
    const date = (item.alertDate||'').slice(0, 10);
    const time = item.alertDate ? item.alertDate.slice(11, 16) : '';
    const fullTime = item.alertDate ? item.alertDate.slice(11, 19) : '';
    const isEnd = item.category === 13;
    if (!currentGroup || currentGroup.date !== date || currentGroup.fullTime !== fullTime || currentGroup.isEnd !== isEnd) {
      currentGroup = { date, time, fullTime, title: item.title, isEnd, cities: [] };
      groups.push(currentGroup);
    }
    currentGroup.cities.push(item.data);
  }

  for (const g of groups) {
    if (g.date !== lastDate) {
      lastDate = g.date;
      const sep = document.createElement('div');
      sep.style.cssText = 'padding:6px 14px;font-size:11px;font-weight:bold;color:#f39c12;background:#1e1e1e;border-bottom:1px solid #333';
      sep.textContent = g.date.slice(8,10) + '/' + g.date.slice(5,7) + '/' + g.date.slice(0,4);
      list.appendChild(sep);
    }

    const div = document.createElement('div');
    div.style.cssText = 'padding:10px 14px;border-bottom:1px solid #2a2a2a;font-size:13px';
    const titleColor = g.isEnd ? '#2ecc71' : '#e74c3c';
    const citiesText = g.cities.map(city => {
      const c = citiesMap[city];
      const nameEn = c ? c.name_en : '';
      return nameEn ? `${city} (${nameEn})` : city;
    }).join(', ');

    div.innerHTML = `
      <div style="display:flex;justify-content:space-between;align-items:center">
        <span style="font-weight:bold;color:${titleColor}">${g.title}</span>
        <span style="font-size:11px;color:#888">${g.time}</span>
      </div>
      <div style="margin-top:4px;color:#ccc;font-size:12px">${citiesText}</div>
    `;
    list.appendChild(div);
  }
}

// Schedule fetch every 5 min to accumulate throughout the day
function schedulePeriodicFetch() {
  setInterval(() => {
    lastOrefFetch = 0; // force refresh
    fetchOrefHistory();
  }, 300000); // every 5 minutes
}

// ── Boot ───────────────────────────────────────────────────────────────────
(async () => {
  try { await loadCities(); } catch(e) { showError('Failed to load cities: '+e.message); }
  connectWS();
  // Load archive from localStorage immediately, then fetch fresh data
  orefHistoryData = loadArchive();
  if (orefHistoryData.length) renderOrefHistory(orefHistoryData);
  fetchOrefHistory();
  schedulePeriodicFetch();
})();
</script>
<style>@keyframes blink{0%,100%{opacity:1}50%{opacity:0.3}}</style>
</body>
